<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galatiq · Invoice Operations</title>
<style>
:root{--bg:#000;--surface:#070707;--line:#202020;--text:#fff;--muted:#939393;--green:#009a6c;--light:#62dab4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:white;font:14px/1.5 Arial,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--light);outline-offset:4px}button{color:white;border:1px solid #303030;background:#101010;border-radius:8px;padding:10px 16px}button:hover{border-color:#777;background:#181818}button.primary{background:var(--green);border-color:var(--green)}button.primary:hover{background:#087d5b}button.ghost{background:transparent;border:0;color:#aaa;padding:6px 0}button.icon{padding:8px 12px}header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 38px;gap:20px}.brand{display:flex;align-items:center;gap:22px}.wordmark{font-size:24px;font-weight:800;letter-spacing:4px}.brand small{border-left:1px solid #393939;padding-left:22px;color:#999;font-size:12px}.header-right{display:flex;align-items:center;gap:18px}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #154331;color:#b8e7d4;background:rgba(23,145,106,.13);font-size:11px;padding:6px 10px;border-radius:6px}.dot{width:6px;height:6px;background:#32bf8c;border-radius:50%}.avatar{border:1px solid #333;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:11px;color:#bbb}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 82px)}aside{border-right:1px solid var(--line);padding:32px 16px;display:flex;flex-direction:column}.nav-label{font-size:9px;letter-spacing:2px;color:#666;margin:0 16px 18px}.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:6px;color:#999;text-align:left;margin:4px 0;padding:12px 16px}.nav.active{color:white;background:#121212;box-shadow:inset 2px 0 var(--green)}.nav .navicon{font-size:18px;width:20px}.count{margin-left:auto;border:1px solid #333;padding:0 6px;font-size:10px;border-radius:4px}.side-bottom{margin-top:auto;padding:60px 16px 0;color:#777;font-size:11px}.side-bottom strong{display:block;color:#ccc;font-weight:400;margin-bottom:7px}.side-bottom hr{border:0;border-top:1px solid var(--line);margin:20px 0}.workspace{padding:36px 40px 22px;max-width:1600px;width:100%;margin:auto}.eyebrow{color:#929292;letter-spacing:2px;font-size:10px;text-transform:uppercase}.hero{min-height:185px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0 30px}.hero-copy{z-index:1;position:relative}.hero h1{font-size:36px;line-height:1.15;letter-spacing:-1.4px;margin:14px 0}.hero p{color:#a6a6a6;margin:0;font-size:13px}.hero svg{position:absolute;width:62%;height:230px;right:-60px;top:-10px;opacity:.56;pointer-events:none}.hero .primary{z-index:1;margin-top:33px;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:28px 0}.metric{padding:22px 24px;border-right:1px solid var(--line);background:linear-gradient(130deg,#0d0d0d,#040404)}.metric:last-child{border:0}.metric-head{color:#aaa;font-size:11px;display:flex;justify-content:space-between}.metric-number{font-size:38px;line-height:1.2;margin:14px 0 8px;font-weight:400;letter-spacing:-1px}.metric-number.green{color:var(--light)}.metric-foot{font-size:10px;color:#777}.metric-foot span{color:#b6b6b6}.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 17px;gap:20px}h2{font-size:17px;letter-spacing:-.3px;font-weight:500;margin:0}.sub{color:#777;font-size:11px;margin:5px 0 0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0 16px}.tabs{display:flex;gap:6px}.tab{border:1px solid transparent;background:transparent;font-size:11px;padding:7px 12px;color:#888;border-radius:6px}.tab.active{background:#171717;color:white;border-color:#303030}.search{background:#090909;border:1px solid #292929;padding:8px 12px;border-radius:6px;color:white;min-width:210px;font-size:11px}.table-wrap{border:1px solid var(--line);border-radius:9px;overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:#0c0c0c;color:#707070;font-weight:400;font-size:10px;padding:14px 18px}td{padding:18px;border-top:1px solid var(--line);font-size:12px}td small{display:block;color:#666;font-size:10px;margin-top:4px}tbody tr:hover{background:#0a0a0a}.num{text-align:right;font-variant-numeric:tabular-nums}.status{border:1px solid #333;border-radius:5px;padding:4px 8px;font-size:10px;display:inline-block;color:#ccc}.status.paid{color:#9ce4c8;border-color:#174b37;background:#062318}.status.review{border-color:#514936;color:#d6c9a3;background:#15130e}.status.rejected{color:#c4b1b1;background:#171111;border-color:#453333}.rowopen{background:none;border:0;padding:4px 9px;color:#888;font-size:18px}.bottom-panels{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:24px}.panel{border:1px solid var(--line);border-radius:10px;background:#070707;padding:22px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.panel-title h2{font-size:13px}.activity{display:flex;gap:14px;margin-top:19px;font-size:11px}.activity-icon{width:26px;height:26px;display:grid;place-items:center;border:1px solid #254033;border-radius:50%;color:var(--light);flex-shrink:0}.activity p{margin:0;color:#ccc}.activity small{color:#6f6f6f;font-size:10px}.pipeline{display:flex;justify-content:space-between;margin:26px 0 17px;gap:7px}.pipeline div{text-align:center;color:#9d9d9d;font-size:9px}.pipeline i{width:32px;height:32px;border:1px solid #28503d;background:#0b1b13;display:grid;place-items:center;margin:0 auto 10px;border-radius:8px;color:var(--light);font-style:normal}.pipeline-line{height:1px;background:#234333;flex:1;margin-top:16px}.footer{display:flex;justify-content:space-between;color:#555;font-size:10px;margin:24px 0 0}.detail-top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:24px 0}.detail-top h1{font-size:30px;margin:6px 0}.detail-top p{color:#999;margin:6px 0}.detail-grid{display:grid;grid-template-columns:1fr 1.12fr;gap:22px;margin:22px 0}.source{white-space:pre-wrap;font:12px/2 monospace;color:#bbb;background:#0c0c0c;border:1px solid #242424;padding:24px;border-radius:8px;min-height:275px}.check{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:13px 0;font-size:12px;color:#aaa}.check b{font-weight:400;color:white}.decision-message{font-size:21px;line-height:1.3;margin:12px 0}.decision-sub{color:#999;font-size:12px;line-height:1.8}.notice{font-size:11px;color:#a0a0a0;border-left:2px solid var(--green);padding:8px 14px;margin:18px 0;background:#0b110e}.back{color:#999;font-size:12px}.empty{padding:60px;text-align:center;color:#999}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.83);z-index:10;display:grid;place-items:center;padding:20px;backdrop-filter:blur(5px)}.modal{width:560px;max-width:100%;background:#0a0a0a;border:1px solid #333;border-radius:14px;padding:28px;box-shadow:0 0 100px #002b1d66}.modal h2{font-size:24px}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal p{color:#888;font-size:12px}.sample{display:flex;align-items:center;justify-content:space-between;border:1px solid #282828;background:#101010;border-radius:8px;padding:14px;margin:10px 0;cursor:pointer}.sample:has(input:checked){border-color:var(--green);background:#081810}.sample span{display:block;font-size:12px}.sample small{color:#777;font-size:10px}.sample input{accent-color:var(--green)}.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border:1px solid #24543d;background:#102019;color:#d3e7da;padding:13px 22px;border-radius:8px;z-index:30;font-size:12px}.progress-item{padding:17px;border-bottom:1px solid #222;color:#777}.progress-item.done{color:#9ee3c8}.progress-item.current{color:white}.preview-banner{color:#777;font-size:10px;letter-spacing:.4px}.inline-link{color:#bbb;text-decoration:none}.hidden{display:none!important}@media(min-width:1500px){.workspace{padding-top:45px}.hero{min-height:210px}.hero h1{font-size:44px}}@media(max-width:1100px){.layout{grid-template-columns:170px 1fr}.workspace{padding:26px 24px}.brand small{display:none}.metric{padding:18px 16px}.bottom-panels{grid-template-columns:1fr}.hero h1{font-size:30px}}@media(max-width:760px){header{padding:0 20px;height:68px}.header-right .avatar,.header-right .preview-banner{display:none}.wordmark{font-size:19px}.layout{display:block}aside{padding:8px 12px;border-right:0;border-bottom:1px solid #222;flex-direction:row}.nav-label,.side-bottom{display:none}.nav{font-size:11px;justify-content:center;padding:9px}.navicon{display:none}.workspace{padding:24px 16px}.hero{min-height:200px;display:block}.hero .primary{margin-top:20px}.hero svg{width:100%;right:-120px}.hero h1{font-size:30px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid #222}.toolbar{align-items:stretch;flex-direction:column}.tabs{overflow:auto}.detail-grid{grid-template-columns:1fr}.footer{gap:18px}.detail-top{align-items:flex-start}.detail-top h1{font-size:24px}.pipeline{gap:4px}.metric-number{font-size:32px}}

</style></head>
<body><header><div class="brand"><span class="wordmark">GALATIQ<span style="color:#009a6c">.</span></span><small>INVOICE OPERATIONS</small></div><div class="header-right"><span class="preview-banner">INTERACTIVE DESIGN PREVIEW</span><span class="pill"><span class="dot"></span> Offline simulation</span><div class="avatar">AC</div></div></header>
<div class="layout"><aside><div class="nav-label">WORKSPACE</div><button class="nav active" data-view="overview"><span class="navicon">▦</span>Overview</button><button class="nav" data-view="invoices"><span class="navicon">▤</span>Invoices<span class="count">4</span></button><button class="nav" data-view="review"><span class="navicon">◷</span>Needs review<span class="count">1</span></button><div class="side-bottom"><strong><span style="color:#009a6c">●</span> Local workspace</strong>Acme Corp · Case study<hr>Illustrative data.<br>All payments are simulated.</div></aside><main class="workspace" id="app"></main></div><div id="overlay"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const invoices=[
{id:'INV-1001',vendor:'Widgets Inc.',amount:5000,currency:'USD',status:'paid',date:'Feb 1, 2026',file:'invoice_1001.txt',items:[['WidgetA',10,15,250],['WidgetB',5,10,500]],reason:'Mock payment complete.',explain:'All required fields, inventory checks, and invoice totals passed. The simulated approval review found no payment blockers.'},
{id:'INV-1004',vendor:'Precision Parts Ltd.',amount:1890,currency:'USD',status:'paid',date:'Feb 22, 2026',file:'invoice_1004.json',items:[['WidgetA',3,15,250],['WidgetB',2,10,500]],reason:'Mock payment complete.',explain:'The USD 1,750.00 subtotal and USD 140.00 tax reconcile with the invoice total. Requested quantities are within stock.'},
{id:'INV-1002',vendor:'Gadgets Co.',amount:15000,currency:'USD',status:'rejected',date:'Jan 30, 2026',file:'invoice_1002.txt',items:[['GadgetX',20,5,750]],reason:'Requested quantity exceeds stock.',explain:'The invoice requests 20 GadgetX, but only 5 are available. Additional scrutiny for this high-value invoice does not resolve the stock mismatch. Payment was not attempted.'},
{id:'INV-1014',vendor:'TechParts International',amount:4125,currency:'EUR',status:'review',date:'Feb 26, 2026',file:'invoice_1014.xml',items:[['WidgetA',4,15,225],['WidgetB',6,10,475]],reason:'This currency needs review.',explain:'Inventory and arithmetic checks passed. This prototype supports USD-only mock settlement. The invoice remains EUR; no conversion or payment was attempted.'}
];
const labels={paid:'Mock paid',review:'Needs review',rejected:'Rejected'};const symbols={paid:'✓',review:'!',rejected:'×'};let view='overview',filter='all',query='',current=null,detailTab='Decision',timer;
const money=(n,c='USD')=>c+' '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const badge=i=>`<span class="status ${i.status}">${symbols[i.status]} &nbsp;${labels[i.status]}</span>`;
function wave(){let s='<svg viewBox="0 0 650 230" fill="none" aria-hidden="true"><defs><linearGradient id="fade"><stop stop-color="#009a6c" stop-opacity="0"/><stop offset=".5" stop-color="#009a6c"/><stop offset="1" stop-color="#009a6c" stop-opacity=".2"/></linearGradient></defs>';for(let i=0;i<22;i++){let y=30+i*7;s+=`<path d="M0 ${y+50} C150 ${y-150} 290 ${y+180} 450 ${y-20} S590 ${y-50} 700 ${y+30}" stroke="url(#fade)" stroke-width=".65"/>`;}for(let i=0;i<25;i++){let x=i*29;s+=`<path d="M${x} 0 Q${x-100} 95 ${x+30} 240" stroke="#009a6c" stroke-opacity=".18" stroke-width=".6"/>`;}return s+'</svg>'}
function foot(){return '<footer class="footer"><span>GALATIQ / BUILT FOR THE WORK THAT MATTERS.</span><span>Design preview · Sample data · No real payments</span></footer>'}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));if(current){detail();return;}let review=view==='review';let title=review?'Exceptions, explained.':view==='invoices'?'Every invoice. Full visibility.':'Less processing. More progress.';document.getElementById('app').innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">ACME CORP / ACCOUNTS PAYABLE</div><h1>${title}</h1><p>${review?'Understand what needs attention before anything moves.':'Your invoice workflow. From first look to final decision.'}</p></div>${wave()}<button class="primary" onclick="addInvoice()">＋ &nbsp; Add invoice</button></section>${view==='overview'?metrics():''}<div class="section-head"><div><h2>${review?'Needs review':'Invoice workspace'}</h2><p class="sub">${review?'Unresolved decisions. Clear evidence.':'Illustrative outcomes across four unique invoices.'}</p></div><span class="eyebrow">${review?'1 EXCEPTION':'4 INVOICES'}</span></div>${review?'<div class="notice">Review resolution is outside this prototype. Open an invoice to inspect the reason and supporting evidence.</div>':''}<div class="toolbar"><div class="tabs">${(review?['review']:['all','paid','review','rejected']).map(f=>`<button class="tab ${filter===f||review?'active':''}" onclick="setFilter('${f}')">${f==='all'?'All invoices':labels[f]}</button>`).join('')}</div><input class="search" type="search" aria-label="Search invoices" placeholder="Search vendor or invoice…" oninput="searchRows(this.value)"></div><div id="rows"></div>${view==='overview'?panels():''}${foot()}`;rows();}
function metrics(){return `<div class="metrics"><div class="metric"><div class="metric-head">Unique invoices <span>▤</span></div><div class="metric-number">04</div><div class="metric-foot">Four sample documents</div></div><div class="metric"><div class="metric-head">Mock paid <span>↗</span></div><div class="metric-number green">02</div><div class="metric-foot"><span>USD 6,890.00</span> simulated</div></div><div class="metric"><div class="metric-head">Needs review <span>◷</span></div><div class="metric-number">01</div><div class="metric-foot">Unsupported settlement currency</div></div><div class="metric"><div class="metric-head">Rejected <span>⊘</span></div><div class="metric-number">01</div><div class="metric-foot">Inventory mismatch detected</div></div></div>`;}
function rows(){let data=invoices.filter(i=>(view==='review'?i.status==='review':filter==='all'||i.status===filter)&&`${i.id} ${i.vendor}`.toLowerCase().includes(query.toLowerCase()));document.getElementById('rows').innerHTML=`<div class="table-wrap"><table><thead><tr><th>INVOICE / VENDOR</th><th>DUE DATE</th><th class="num">AMOUNT</th><th>OUTCOME</th><th></th></tr></thead><tbody>${data.map(i=>`<tr><td><strong style="font-weight:500">${i.vendor}</strong><small>${i.id}</small></td><td style="color:#8b8b8b">${i.date}</td><td class="num">${money(i.amount,i.currency)}</td><td>${badge(i)}</td><td><button class="rowopen" aria-label="Open ${i.id}" onclick="openInvoice('${i.id}')">↗</button></td></tr>`).join('')}</tbody></table>${data.length?'':'<div class="empty">No invoices match your search.</div>'}</div>`;}
function panels(){return `<div class="bottom-panels"><section class="panel"><div class="panel-title"><h2>Decision feed</h2><span class="eyebrow">SAMPLE ACTIVITY</span></div><div class="activity"><div class="activity-icon">✓</div><div><p>Widgets Inc. passed every check.</p><small>INV-1001 · USD 5,000.00 mock paid</small></div></div><div class="activity"><div class="activity-icon">!</div><div><p>TechParts needs a currency review.</p><small>INV-1014 · EUR settlement unsupported</small></div></div><div class="activity"><div class="activity-icon">×</div><div><p>Gadgets Co. exceeded available inventory.</p><small>INV-1002 · Requested 20, available 5</small></div></div></section><section class="panel"><div class="panel-title"><h2>Four stages. One clear outcome.</h2></div><div class="pipeline"><div><i>▤</i>EXTRACT</div><span class="pipeline-line"></span><div><i>✓</i>VALIDATE</div><span class="pipeline-line"></span><div><i>◈</i>REVIEW</div><span class="pipeline-line"></span><div><i>↗</i>MOCK PAY</div></div><p class="sub" style="line-height:1.8;margin-top:24px">Every outcome comes with evidence. Every payment stays simulated. Open an invoice to follow the decision.</p></section></div>`;}
function setFilter(f){filter=f;query='';render();}function searchRows(q){query=q;rows();}function openInvoice(id){current=invoices.find(i=>i.id===id);detailTab='Decision';detail();window.scrollTo(0,0);}function goBack(){current=null;render();}
function detail(){let i=current;document.getElementById('app').innerHTML=`<button class="ghost back" onclick="goBack()">← &nbsp; Back to workspace</button><div class="detail-top"><div><div class="eyebrow">INVOICE DETAIL / SAMPLE RESULT</div><h1>${i.vendor}</h1><p>${i.id} &nbsp;·&nbsp; ${money(i.amount,i.currency)} &nbsp;·&nbsp; Due ${i.date}</p></div>${badge(i)}</div><div class="notice">Offline simulation · Illustrative result. Historical due dates are shown as supplied, without a current overdue evaluation.</div><div class="detail-grid"><section class="panel"><div class="panel-title"><h2>Source preview</h2><span class="eyebrow">${i.file.split('.').pop()}</span></div><div class="source">${source(i)}</div><p class="sub" style="margin-top:12px">${i.file} · Representative excerpt, not a rendered original.</p></section><section class="panel"><div class="tabs" style="margin-bottom:22px">${['Decision','Checks','History'].map(t=>`<button class="tab ${detailTab===t?'active':''}" onclick="changeTab('${t}')">${t}</button>`).join('')}</div><div id="detailBody">${detailBody(i)}</div></section></div><section class="panel"><div class="panel-title"><h2>Line-item validation</h2><span class="eyebrow">LOCAL INVENTORY</span></div><div class="table-wrap"><table><thead><tr><th>ITEM</th><th class="num">REQUESTED</th><th class="num">AVAILABLE</th><th class="num">UNIT PRICE</th><th>CHECK</th></tr></thead><tbody>${i.items.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${money(r[3],i.currency)}</td><td>${r[1]>r[2]?'× Exceeds stock':'✓ Within stock'}</td></tr>`).join('')}</tbody></table></div></section><div class="section-head"><p class="sub">${i.status==='paid'?'Sample mock receipt · No real funds transferred.':'Payment not attempted in this example.'}</p><button onclick="downloadResult()">↓ &nbsp; Download sample result</button></div>${foot()}`;}
function source(i){return `INVOICE\n\nVendor: ${i.vendor}\nInvoice: ${i.id}\nDue: ${i.date}\n\n${i.items.map(r=>r[0].padEnd(13)+' × '+r[1]+'   '+money(r[3],i.currency)).join('\n')}\n\nTOTAL: ${money(i.amount,i.currency)}`;}
function changeTab(t){detailTab=t;detail();}function detailBody(i){if(detailTab==='Checks')return `<div class="eyebrow">EVIDENCE SUMMARY</div>${[['Required fields','✓ Present'],['Inventory',i.status==='rejected'?'× GadgetX: 20 > 5':'✓ Within available stock'],['Arithmetic','✓ Totals reconcile'],['Currency',i.currency==='EUR'?'! EUR unsupported':'✓ USD'],['High-value review',i.amount>10000?'Required; stock blocker remains':'Below USD 10,000 threshold']].map(r=>`<div class="check"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}<p class="sub" style="margin-top:20px">Illustrative checks derived from sample fixtures.</p>`;if(detailTab==='History')return `<div class="eyebrow">ILLUSTRATIVE WORKFLOW</div>${['Document received','Structured fields extracted','Inventory and totals checked','Recommendation critiqued',i.status==='paid'?'Mock receipt recorded':i.status==='review'?'Unresolved currency sent to review':'Stock mismatch rejected; payment skipped'].map((s,n)=>`<div class="activity"><div class="activity-icon">${n+1}</div><div><p>${s}</p><small>Sample event · No live execution</small></div></div>`).join('')}`;return `<div class="eyebrow">FINAL OUTCOME</div><h2 class="decision-message">${i.reason}</h2><p class="decision-sub">${i.explain}</p><div class="check"><span>Recommendation</span><b>${i.status==='paid'?'Approve':i.status==='review'?'Needs review':'Reject'}</b></div><div class="check"><span>Payment</span><b>${i.status==='paid'?'Simulated success':'Not attempted'}</b></div><p class="sub" style="margin-top:20px;line-height:1.8">${i.status==='review'?'Human resolution is outside this preview. No override action is available.':'The critique checks the recommendation against policy. It cannot override a validation blocker.'}</p>`;}
function downloadResult(){let b=new Blob([JSON.stringify({illustrative:true,not_a_real_receipt:true,mode:'design_preview',invoice:current},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=current.id+'-sample-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Illustrative result downloaded.');}
function addInvoice(){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle">Try the workflow.</h2><button class="icon" onclick="closeModal()" aria-label="Close dialog">×</button></div><p>This visual prototype uses built-in examples. File upload and actual processing will be added with the backend.</p>${invoices.map((i,n)=>`<label class="sample"><div><span>${i.vendor}</span><small>${i.id} · ${money(i.amount,i.currency)} · ${labels[i.status]}</small></div><input type="radio" name="sample" value="${i.id}" ${n===0?'checked':''}></label>`).join('')}<div class="notice">Demo animation only. These invoices already appear in the sample workspace; totals will not increase.</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="simulate()">Preview processing &nbsp; →</button></div></section></div>`;document.querySelector('.modal .icon').focus();}
let trigger;function closeModal(){clearTimeout(timer);document.getElementById('overlay').innerHTML='';document.querySelector('.primary')?.focus();}function simulate(){let id=document.querySelector('input[name=sample]:checked').value;let i=invoices.find(x=>x.id===id);let stages=['Extract invoice fields','Check stock and reconcile totals','Review and critique the decision',i.status==='paid'?'Show sample mock receipt':'Skip payment and show outcome'];let step=0;function tick(){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="processingTitle"><div class="modal-header"><h2 id="processingTitle">Following the invoice.</h2><button class="icon" onclick="closeModal()" aria-label="Close preview">×</button></div><p>${i.id} · Demo animation, no backend calls</p><div aria-live="polite">${stages.map((s,n)=>`<div class="progress-item ${n<step?'done':n===step?'current':''}">${n<step?'✓':n===step?'●':'○'} &nbsp; ${s}</div>`).join('')}</div><p>Existing sample data is unchanged.</p></section></div>`;if(step++<4)timer=setTimeout(tick,650);else timer=setTimeout(()=>{closeModal();openInvoice(id);notify('Sample outcome opened. No invoice was processed.');},300);}tick();}
function notify(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500);}
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{view=n.dataset.view;filter='all';query='';current=null;render();}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){let f=[...document.querySelectorAll('.modal button,.modal input')].filter(x=>!x.disabled);let a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}}});render();
</script></body></html>
