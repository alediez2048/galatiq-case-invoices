[project]
name = "invoice-processing"
version = "0.1.0"
description = "Galatiq case: multi-agent invoice processing prototype"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7,<0.8",
    "fastapi>=0.115,<1",
    "langgraph>=1.2,<2",
    "langsmith>=0.14,<1",
    "pdfplumber>=0.11,<0.12",
    "pydantic>=2.9",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
    "xai-sdk>=1.21,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pypdf>=6,<7",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -m 'not live'"
markers = [
    "real_xai_factory: keep the real xai_sdk client factory (gRPC channels stay blocked)",
    "live: real xAI calls; needs RUN_LIVE_TESTS=1",
    "real_dotenv: keep the real .env loader (the test must chdir to a tmp .env)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["README.md", "docs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
